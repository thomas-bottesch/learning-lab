apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner
      containers:
      - name: runner
        image: forgejo-runner-python3.12:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e

            echo "OS Information:"
            cat /etc/os-release
            echo "Node version:"
            node --version
            echo "Python version:"
            python --version
            python3 --version
            python3.12 --version
            echo "Git version:"
            git --version

            CONFIG_FILE=/data/.runner

            # Install Forgejo runner
            FORGEJO_RUNNER_VERSION=12.7.0
            curl -L -o /usr/local/bin/forgejo-runner \
              https://code.forgejo.org/forgejo/runner/releases/download/v${FORGEJO_RUNNER_VERSION}/forgejo-runner-${FORGEJO_RUNNER_VERSION}-linux-amd64
            chmod +x /usr/local/bin/forgejo-runner

            # Wait for Forgejo
            echo "Waiting for Forgejo..."
            while ! (echo > /dev/tcp/forgejo.forgejo.svc.cluster.local/4000) 2>/dev/null; do
              sleep 2
            done
            echo "Forgejo is up!"

            # Register runner
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "Registering runner..."
              forgejo-runner register \
                --no-interactive \
                --token "XgsbRVxZ1_RK43W1UpEPCPV3xq4WMXYCAQgRO1Wf33W" \
                --name k8s-runner \
                --labels linux \
                --instance http://172.17.0.1:4000
            fi

            CONFIG=/actions-runner/config.yaml

            echo "Docker socket permissions:"
            ls -l /var/run/docker.sock

            if [ ! -f "$CONFIG" ]; then
            cat <<EOF > $CONFIG
            runner:
              capacity: 1

            container:
              options: "-v /var/run/docker.sock:/var/run/docker.sock"
              valid_volumes:
                - /var/run/docker.sock
            EOF
            fi

            echo "Starting runner daemon..."
            exec forgejo-runner daemon --config $CONFIG
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: runner-data
          mountPath: /data
        securityContext:
          runAsUser: 0
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: runner-data
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "secrets"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner
subjects:
- kind: ServiceAccount
  name: forgejo-runner
  namespace: forgejo