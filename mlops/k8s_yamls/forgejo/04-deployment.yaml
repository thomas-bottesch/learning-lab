apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      containers:
        - name: forgejo
          image: data.forgejo.org/forgejo/forgejo:14.0.1-rootless
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"

            # Force WorkPath to /data (so DB and admin creation work)
            - name: FORGEJO__paths__DATA
              value: "/data"

            # Database
            - name: FORGEJO__database__DB_TYPE
              value: "sqlite3"
            - name: FORGEJO__database__PATH
              value: "/data/forgejo/forgejo.db"

            # Server
            - name: FORGEJO__server__DOMAIN
              value: "localhost"
            - name: FORGEJO__server__ROOT_URL
              value: "http://localhost:4000/"
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "true"
            - name: FORGEJO__server__SSH_PORT
              value: "22"
            - name: FORGEJO__server__SSH_DOMAIN
              value: "localhost"

            # Security
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"

            # Actions
            - name: FORGEJO__actions__ENABLED
              value: "true"

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-pvc