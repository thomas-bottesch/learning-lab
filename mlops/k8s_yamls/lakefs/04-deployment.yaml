apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakefs
  namespace: lakefs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakefs
  template:
    metadata:
      labels:
        app: lakefs
    spec:
      containers:
        - name: lakefs
          image: treeverse/lakefs:1.77.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: lakefs-credentials
          volumeMounts:
            - name: metadata
              mountPath: /data/lakefs
          startupProbe:
            httpGet:
              path: /api/v1/setup_lakefs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: metadata
          persistentVolumeClaim:
            claimName: lakefs-metadata-pvc
