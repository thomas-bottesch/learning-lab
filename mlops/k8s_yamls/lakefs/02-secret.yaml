apiVersion: v1
kind: Secret
metadata:
  name: lakefs-credentials
  namespace: lakefs
type: Opaque
stringData:
  # lakeFS admin credentials
  LAKEFS_AUTH_ADMIN_ACCESS_KEY_ID: "AKIAJM7NJ6KZDV4UETMQ"
  LAKEFS_AUTH_ADMIN_SECRET_ACCESS_KEY: "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"
  # Required: Encryption secret key for sensitive data (must be 32+ chars)
  LAKEFS_AUTH_ENCRYPT_SECRET_KEY: "this-is-a-32-byte-secret-key-for-lakefs-encryption"
  # Database connection (using SQLite for single-node, use PostgreSQL for production)
  LAKEFS_DATABASE_TYPE: "local"
