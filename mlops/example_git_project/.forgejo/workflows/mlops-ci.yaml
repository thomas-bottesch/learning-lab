name: MLOps Training Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  PROJECT_NAME: mlops-example
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  COMMIT_SHA: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate Code Structure
    runs-on: linux
    container:
      image: forgejo-runner-python3.12:latest
    env:
      KUBEFLOW_HOST: ${{ vars.KUBEFLOW_HOST }}
      KUBEFLOW_USERNAME: ${{ vars.KUBEFLOW_USERNAME }}
      KUBEFLOW_PASSWORD: ${{ secrets.KUBEFLOW_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Ensure Python 3.12 is used
        run: |
          python3.12 --version
          uv --version
          python3.12 -m venv venv
          . venv/bin/activate
          uv pip install --upgrade pip
      
      - name: Check Python syntax
        run: |
          echo "Testing training script structure..."
          
          echo "1. Checking Python syntax..."
          python -m py_compile train.py && echo "✓ train.py syntax OK"
          python -m py_compile utils/mlops_utils.py && echo "✓ mlops_utils.py syntax OK"
          
          echo "2. Checking requirements.txt..."
          if [ -f requirements.txt ]; then
              echo "✓ requirements.txt exists"
              cat requirements.txt
          else
              echo "✗ requirements.txt missing"
              exit 1
          fi
          
          echo "3. Checking Dockerfile..."
          if [ -f Dockerfile ]; then
              echo "✓ Dockerfile exists"
              grep FROM Dockerfile || echo "No FROM line found"
          else
              echo "✗ Dockerfile missing"
              exit 1
          fi
          
          echo "4. Checking MLOps utilities structure..."
          if [ -d utils/kubeflow ]; then
              echo "✓ Kubeflow utilities exist"
              ls -la utils/kubeflow/
          else
              echo "✗ Kubeflow utilities missing"
              exit 1
          fi
          echo "✅ All structural checks passed!"

  build:
    name: Build Training Image
    runs-on: linux
    needs: validate
    container:
      image: forgejo-runner-python3.12:latest
    env:
      KUBEFLOW_HOST: ${{ vars.KUBEFLOW_HOST }}
      KUBEFLOW_USERNAME: ${{ vars.KUBEFLOW_USERNAME }}
      KUBEFLOW_PASSWORD: ${{ secrets.KUBEFLOW_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          echo "Building Docker image..."

          IMAGE_NAME="${{ github.repository_owner }}-${{ env.REPOSITORY_NAME }}"
          TAG=$(echo "${{ env.COMMIT_SHA }}" | cut -c1-8)
          
          echo "Building: ${IMAGE_NAME}:${TAG}"
          docker build -t ${IMAGE_NAME}:${TAG} -t ${IMAGE_NAME}:latest .
          
          echo "✅ Docker image built successfully!"
          docker images | grep ${IMAGE_NAME}

  create_initial_data:
    name: Create Initial Data
    runs-on: linux
    needs: build
    container:
      image: forgejo-runner-python3.12:latest
    env:
      KUBEFLOW_HOST: ${{ vars.KUBEFLOW_HOST }}
      KUBEFLOW_USERNAME: ${{ vars.KUBEFLOW_USERNAME }}
      KUBEFLOW_PASSWORD: ${{ secrets.KUBEFLOW_PASSWORD }}
      KUBEFLOW_NAMESPACE: ${{ vars.KUBEFLOW_NAMESPACE }}
      MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      LAKEFS_ENDPOINT: ${{ vars.LAKEFS_ENDPOINT }}
      LAKEFS_ACCESS_KEY: ${{ secrets.LAKEFS_ACCESS_KEY }}
      LAKEFS_SECRET_KEY: ${{ secrets.LAKEFS_SECRET_KEY }}
      LAKEFS_BUCKET_NAME: ${{ vars.LAKEFS_BUCKET_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python environment
        run: |
          echo "Setting up Python environment..."
          python3.12 -m venv venv
          . venv/bin/activate
          uv pip install --upgrade pip
          uv pip install -r requirements.txt
      
      - name: Compile LakeFS initial data pipeline
        run: |
          echo "Compiling LakeFS initial data pipeline..."
          . venv/bin/activate
          python create_initial_data_pipeline.py --output lakefs_initial_data_pipeline.yaml
          echo "✅ Pipeline compiled successfully!"
      
      - name: Submit pipeline to Kubeflow
        run: |
          echo "Submitting LakeFS initial data pipeline to Kubeflow..."
          . venv/bin/activate
          env
          # Import and use the submitter
          python -c "
          import os
          import sys
          from utils.kubeflow.pipeline_submitter import submit_pipeline
          
          result = submit_pipeline(
              pipeline_path='lakefs_initial_data_pipeline.yaml',
              pipeline_name='lakefs-initial-data-setup',
              experiment_name='initial-data-setup',
              run_name=f'initial-data-setup-${{ env.COMMIT_SHA }}',
              additional_params={'lakefs_repository': 'mlops-data'}
          )
          
          print('Pipeline submitted successfully!')
          print(f'Run ID: {result[\"run_id\"]}')
          "
          echo "✅ LakeFS initial data pipeline submitted successfully!"
      
      - name: Summary
        run: |
          echo "=========================================="
          echo "✅ Initial Data Setup Pipeline Completed"
          echo "=========================================="
          echo ""
          echo "What was accomplished:"
          echo "  1. ✅ Created LakeFS repository 'mlops-data'"
          echo "  2. ✅ Initialized main branch"
          echo "  3. ✅ Uploaded iris dataset to main branch"
          echo "  4. ✅ Created dataset metadata"
          echo "  5. ✅ Added README documentation"
          echo ""
          echo "The iris dataset is now available in LakeFS at:"
          echo "  s3://mlops-data/main/iris/dataset.json"
          echo ""
          echo "Future pipelines can now:"
          echo "  - Create experiment branches from main"
          echo "  - Read versioned data from specific branches"
          echo "  - Ensure reproducibility through data versioning"
          echo ""
          echo "Next steps:"
          echo "  1. Monitor pipeline execution in Kubeflow UI"
          echo "  2. Verify data in LakeFS: http://localhost:8000"
          echo "  3. Future training pipelines will read from this data"